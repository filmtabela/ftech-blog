name: Daily Blog Publish
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node publish.js
      - name: Commit and push
        run: |
          git config user.email "filmtabela@gmail.com"
          git config user.name "filmtabela"
          git add -A
          git diff --cached --quiet || git commit -m "Published: $(date '+%Y-%m-%d')"
          git push origin main
