name: Site - deploy main pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/ai-visibility/**'
      - 'site/es/**'
      - 'site/pt/**'
      - 'site/sitemap.xml'
      - 'site/robots.txt'
      - 'site/llms.txt'
      - 'site/logo.png'

permissions:
  contents: read

concurrency:
  group: ftech-site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to Hostinger (old homepage backed up first)
        env:
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          R=u114546712@145.79.209.26
          ROOT=/home/u114546712/domains/ftech.co.in/public_html
          STAMP=$(date +%Y%m%d-%H%M%S)
          sshpass -p "$SSH_PASS" ssh $OPTS -p 65002 $R "mkdir -p /home/u114546712/backups/ftech && cp $ROOT/index.html /home/u114546712/backups/ftech/index-$STAMP.html && mkdir -p $ROOT/ai-visibility $ROOT/es/ai-visibility $ROOT/pt/ai-visibility"
          sshpass -p "$SSH_PASS" ssh $OPTS -p 65002 $R "cd $ROOT && tar czf /home/u114546712/backups/ftech/site-$STAMP.tgz \$(ls -d index.html ai-visibility es pt sitemap.xml robots.txt llms.txt logo.png 2>/dev/null)"
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/index.html $R:$ROOT/index.html
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/ai-visibility/index.html $R:$ROOT/ai-visibility/index.html
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/es/index.html $R:$ROOT/es/index.html
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/es/ai-visibility/index.html $R:$ROOT/es/ai-visibility/index.html
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/pt/index.html $R:$ROOT/pt/index.html
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/pt/ai-visibility/index.html $R:$ROOT/pt/ai-visibility/index.html
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/sitemap.xml $R:$ROOT/sitemap.xml
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/robots.txt $R:$ROOT/robots.txt
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/llms.txt $R:$ROOT/llms.txt
          sshpass -p "$SSH_PASS" scp $OPTS -P 65002 site/logo.png $R:$ROOT/logo.png
          echo "Deployed. Backups: backups/ftech/index-$STAMP.html and site-$STAMP.tgz"
